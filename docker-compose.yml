
services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
# Archive PostgreSQL for old messages
  db_archive:
    image: postgres:15
    container_name: irgpt_db_archive
    environment:
      POSTGRES_DB: ${DB_ARCHIVE_NAME}
      POSTGRES_USER: ${DB_ARCHIVE_USER}
      POSTGRES_PASSWORD: ${DB_ARCHIVE_PASS}
    ports:
      - "5433:5432"  # different host port
    volumes:
      - db_archive_data:/var/lib/postgresql/data
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: uvicorn IRGPT.asgi:application --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    working_dir: /app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - db_archive
      - rabbitmq
volumes:
  postgres_data:
  db_archive_data: